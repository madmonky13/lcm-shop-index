name: Build shop index

# Every hour (at 23 past) plus a manual "Run workflow" button.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: How many products did the last index have?
        id: last
        run: |
          n=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/summary.json" | python3 -c "import sys,json; print(json.load(sys.stdin).get('products',''))" || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Last published: ${n:-none}"

      - name: Build index from the public store list
        env:
          LAST_COUNT: ${{ steps.last.outputs.count }}
        run: python3 build_index.py

      - name: Allow the shop to read it
        run: |
          cp README.md site/README.md 2>/dev/null || true
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  # GitHub switches off hourly schedules in public repos after 60 days without a commit.
  # Once a month (1st, 03:23 UTC run) this writes the date to keepalive.txt so that never happens.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keep-alive commit
        run: |
          if [ "$(date -u +%d%H)" = "0103" ]; then
            date -u +%Y-%m-%d > keepalive.txt
            git config user.name "lcm-shop-index bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "Monthly keep-alive so the hourly build stays switched on"
            git push
          else
            echo "Not the monthly keep-alive slot; nothing to do."
          fi
